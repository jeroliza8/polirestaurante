<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoliRestaurante</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EPR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Inicio de sesion (RF37, RF38) -->
  <section id="login-view" class="login-view">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark">PR</span><span>PoliRestaurante</span></div>
      <p class="muted">Sistema de gestión de pedidos</p>
      <label>Usuario
        <input id="login-user" name="username" autocomplete="username" required maxlength="50">
      </label>
      <label>Contraseña
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="72">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      <p id="login-msg" class="form-error" role="alert"></p>
    </form>
  </section>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
