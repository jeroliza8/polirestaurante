name: Cocina - Java 21 y MySQL 8
on:
  workflow_dispatch:
  push:
    branches: ['cocina*', 'feature/cocina*']
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/cocina-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - '.github/workflows/cocina-ci.yml'
permissions:
  contents: read
jobs:
  cocina:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: DB_Polirestaurante
          MYSQL_USER: cocina_ci
          MYSQL_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_URL: 'jdbc:mysql://127.0.0.1:3306/DB_Polirestaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8'
      DB_USER: cocina_ci
      DB_PASSWORD: ci_app_password
      JWT_SECRET: solo-prueba-ci-cocina-0123456789-abcdef012345
      COCINA_TEST_DB_CONTAINER: ${{ job.services.mysql.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crear esquema de prueba y aplicar auditoría
        run: |
          for script in database/01_schema.sql database/04_cocina_auditoria.sql database/03_datos_prueba.sql; do
            docker exec -i "$COCINA_TEST_DB_CONTAINER" mysql -uroot -pci_root_password < "$script"
          done
      - name: Compilar WAR y ejecutar pruebas unitarias
        run: mvn -B -f backend/pom.xml clean package
      - name: Verificar sintaxis JavaScript
        run: |
          node --input-type=module --check < backend/src/main/resources/static/js/views/cocina.js
          node --input-type=module --check < backend/src/main/resources/static/js/cocina-eventos.js
      - name: Arrancar aplicación y comprobar MySQL y WebSockets
        run: |
          java -jar backend/target/polirestaurante.war > cocina-servidor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/index.html >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat cocina-servidor.log; exit 1; fi
          node backend/src/test/js/cocina-smoke.mjs
      - name: Guardar evidencia de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-cocina
          path: |
            backend/target/surefire-reports/
            cocina-servidor.log
          if-no-files-found: ignore
